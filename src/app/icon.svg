<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="cambodia-favicon-clip">
      <rect width="64" height="64" rx="14" ry="14" />
    </clipPath>
  </defs>
  <g clip-path="url(#cambodia-favicon-clip)">
    <!-- Top Blue Stripe -->
    <rect width="64" height="16" fill="#032EA6" />
    <!-- Center Red Stripe -->
    <rect y="16" width="64" height="32" fill="#ED1B24" />
    <!-- Bottom Blue Stripe -->
    <rect y="48" width="64" height="16" fill="#032EA6" />

    <!-- Detailed Angkor Wat Temple in Pure White -->
    <g fill="#FFFFFF" transform="translate(14, 21)">
      <!-- Base Plinth Steps -->
      <polygon points="0,21 36,21 34.5,19.5 1.5,19.5" />
      <polygon points="2,19.5 34,19.5 32.5,18 3.5,18" />
      <polygon points="4,18 32,18 30.5,16.5 5.5,16.5" />
      <rect x="5.5" y="15" width="25" height="1.5" />

      <!-- Left Tower -->
      <polygon points="8,15 10,8 10.7,5 11.3,5 12,8 14,15" />
      <polygon points="10.2,5 11,2 11.8,5" />
      <rect x="9.5" y="10.5" width="3" height="2.5" fill="#ED1B24" rx="0.5" />

      <!-- Right Tower -->
      <polygon points="22,15 24,8 24.7,5 25.3,5 26,8 28,15" />
      <polygon points="24.2,5 25,2 25.8,5" />
      <rect x="23.5" y="10.5" width="3" height="2.5" fill="#ED1B24" rx="0.5" />

      <!-- Center Tower (Main Tall Spire) -->
      <polygon points="14.5,15 17,6 17.6,3 18.4,3 19,6 21.5,15" />
      <polygon points="17.2,3 18,0 18.8,3" />
      <rect x="16.5" y="9" width="3" height="3.5" fill="#ED1B24" rx="0.5" />

      <!-- Connecting Temple Galleries -->
      <rect x="13.5" y="12" width="2" height="3" />
      <rect x="20.5" y="12" width="2" height="3" />
    </g>
  </g>
  <!-- Subtle border around icon -->
  <rect width="64" height="64" rx="14" ry="14" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="1.5" />
</svg>
